<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Presupuesto del hogar</title>
  <meta name="description" content="Gastos compartidos del hogar, con la hoja de Google Sheets como base de datos.">
  <meta name="theme-color" content="#F6F3EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Presupuesto">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/app.css">
  <script>
    // Aplica el tema guardado antes de dibujar, para que no parpadee.
    try { var t = JSON.parse(localStorage.getItem('pp-tema')) || {};
      if (t.modo && t.modo !== 'auto') { document.documentElement.dataset.theme = t.modo; document.documentElement.dataset.ppModo = '1'; }
      if (t.acento && t.acento !== 'verde') document.documentElement.dataset.acento = t.acento; } catch (e) { t = {}; }
    var r = document.documentElement.dataset;
    r.estilo = t.estilo || 'glass'; r.material = t.material || 'normal'; r.esquinas = t.esquinas || 'squircle';
    r.concentrico = t.concentrico === false ? '0' : '1';
    // Ícono elegido (Más › Apariencia). Safari lo toma de aquí al «Agregar a inicio».
    try { var ic = (location.search.match(/[?&]icono=([a-z]+)/) || [])[1];
      if (ic) localStorage.setItem('pp-icono', ic); else ic = localStorage.getItem('pp-icono');
      if (ic && ic !== 'verde' && /^(azul|violeta|terracota|rosa|grafito|crema|oscuro|original)$/.test(ic)) {
        document.querySelector('link[rel="apple-touch-icon"]').href = './icons/' + ic + '/apple-touch-icon.png';
        document.querySelector('link[rel="icon"]').href = './icons/' + ic + '/icon-192.png';
        document.querySelector('link[rel="manifest"]').href = './manifest-' + ic + '.webmanifest';
      } } catch (e) { /* sin almacenamiento */ }
  </script>
</head>
<body>
  <div id="app" aria-live="polite"><main class="pad"><p class="muted">Cargando…</p></main></div>
  <noscript>Esta app necesita JavaScript.</noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
